[package]
name = "comsolpilot-desktop"
version = "0.2.0"
description = "COMSOLPilot 桌面壳：负责拉起 Python sidecar、原生文件夹选择器和窗口管理"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portpicker = "0.1"

[[bin]]
name = "comsolpilot-desktop"
path = "src/main.rs"
