# Electron 打包配置（与 src-tauri/tauri.conf.json 对等）。
#
# 关键点：
#   * `files` 里**不含 node_modules** —— 主进程只用了 Node 内置模块和 electron 本身，
#     React 那堆依赖已经被 vite 打进 dist/ 了，再塞一遍纯属浪费。
#   * Python 后端作为 extraResources 放进 `resources/sidecar/`，由主进程在
#     `process.resourcesPath` 下找。内容来自 `npm run sidecar:build`。
appId: com.waverlose.comsolpilot
productName: COMSOLPilot

directories:
  output: release
  buildResources: build

# 关掉 asar 打包。
#   * 主进程用 `app://` 自定义协议 + net.fetch(file://) 读 dist/ 下的文件，
#     走 asar 时能否读到包内文件依赖 Electron 版本的实现细节，散着放没有这个不确定性；
#   * 出问题时用户能直接看到 dist/，排查方便。
# 代价只是安装目录里文件多一点，对本项目无所谓。
asar: false

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

extraResources:
  - from: resources/sidecar
    to: sidecar
    filter:
      - "**/*"
  # 打包态主进程要从 process.resourcesPath 下取窗口/任务栏图标
  # （开发态直接读仓库里的 src-tauri/icons/icon.ico）
  - from: src-tauri/icons/icon.ico
    to: icon.ico

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: src-tauri/icons/icon.ico
  artifactName: ${productName}_${version}_x64-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: COMSOLPilot
  deleteAppDataOnUninstall: false
